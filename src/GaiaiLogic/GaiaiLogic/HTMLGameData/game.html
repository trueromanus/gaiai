<html class="task-bar-background-area">
	<head>
	  <link rel="stylesheet" href="w95style.css">
	  <link rel="stylesheet" href="game.css">
	  <style>
		body {
			margin:0;
			padding:0;
			border-spacing: 0;
		}
	  </style>
	</head>
	<body class="task-bar-background-area">
		<div id="triggershub" style="behavior: triggershub; width: 0px; height: 0px;"></div>
		<div id="templateloader" style="behavior: templateloader; width: 0px; height: 0px;"></div>

		<!-- windows container -->
		<div id="windows-container" class="width-full height-full">
		</div>

		<div id="popup-menus-container" class="popup-menus-container" style="display: block;"></div>

		<!-- task bar -->
		<div class="game-task-bar task-bar width-full flex-row">
			<!-- smart button -->
			<div style="width: 80px;">
				<div id="smart-button-root" class="button-idle-panel margin-top-2 margin-left-2">
					<div>
						<div class="smart-button flex-column">
							<div class="item-center flex-row" style="height: 100%;">
								<img class="item-center" src="keys.png" width=20 height=20 />
								<div class="item-center text-bold text-middle-size margin-left-2" style="height: 12px;">Smart</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div id="taskbar-buttons-container"
				 class="margin-left-2 flex-row"
				 style="flex: 2; gap: 2px; behavior: tasbarwindows; height: 100%;" taskbakwindow-script="taskBar.activateWindow({{windowindex}});">
			</div>
			<!-- time panel -->
			<div class="panel flex-column trayicon-panel margin-right-2 margin-top-2 flex-1">
				<div class="flex-row">
					<img class="margin-left-4 item-center" src="enablesound.png" width=20 height=20 />
					<span class="text-middle-plus-size item-center text-right-align margin-left-4 margin-right-2" style="height: 14px; white-space: nowrap;">00:00 AM</span>
				</div>
			</div>
		</div>

		<!-- smart menu -->
		<div id="smartmenu" class="game-smart-main-menu menu-outer-panel">
			<div class="menu-middle-panel">
				<div class="menu-inner-panel innercontainer">
					<div class="left-title flex-column">
						<div class="flex-1"></div>
						<span class="vertical-text item-end text-os-size">SmartCity<span style="color: #FAFBFF;">OS</span></span>
					</div>
					<div class="right-menu">
						<div class="width-full height-full flex-column">
							<div class="menu-hover-area flex-row margin-right-1"
								 style="behavior: actionbutton;"
								 iconbutton-hscript="mainMenu.showProgramsMenu()">
								<img class="margin-left-16 item-center" src="menuprograms.png" width="40" height="40">
								<div style="height: 18px;" class="margin-left-16 item-center text-middle-plus-plus-size">
									Programs
								</div>
							</div>
							<div class="menu-hover-area flex-row margin-right-1">
								<img class="margin-left-16 item-center" src="menudocuments.png" width="40" height="40">
								<div style="height: 18px;" class="margin-left-16 item-center text-middle-plus-plus-size">
									Documents
								</div>
							</div>
							<div class="menu-hover-area flex-row margin-right-1">
								<img class="margin-left-16 item-center" src="menusettings.jfif" width="40" height="40">
								<div style="height: 18px;" class="margin-left-16 item-center text-middle-plus-plus-size">
									Settings
								</div>
							</div>
							<div class="menu-hover-area flex-row margin-right-1">
								<img class="margin-left-16 item-center" src="menuhelp.png" width="40" height="40">
								<div style="height: 18px;" class="margin-left-16 item-center text-middle-plus-plus-size">
									Help
								</div>
							</div>
							<div class="menu-hover-area flex-row margin-right-1"
								 style="behavior: actionbutton;"
								 iconbutton-script="mainMenu.showRunModal()">
								<img class="margin-left-16 item-center" src="menurun.png" width="40" height="40">
								<div style="height: 18px;" class="margin-left-16 item-center text-middle-plus-plus-size">
									Run
								</div>
							</div>
							<div class="horizontal-line margin-top-3">
								<div class="first-line"></div>
								<div class="second-line"></div>
							</div>
							<div class="menu-hover-area flex-row margin-top-5 margin-right-1"
								 style="behavior: actionbutton;"
								 iconbutton-script="mainMenu.showShutDownModal()">
								<img class="margin-left-16 item-center" src="menushutdown.png" width="40" height="40">
								<div style="height: 18px;" class="margin-left-16 item-center text-middle-plus-plus-size">
									Shut Down...
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div id="modal-black-wall" class="modal-black-wall" style="background-color: #d3d3d380; display: none;">
		</div>
		<script src="globals.js"></script>
		<script src="windowManagement.js"></script>
		<script src="mainMenu.js"></script>
		<script>
			taskBar.createWindow('Header lalalla', 0, 0, 200, 200, null, () => { return ''; });

			/*const contentMenu = templateLoader.getTemplate("ProgramsPopupMenu");
			taskBar.showPopupMenu({ width: 150, left: 20, top: 20 }, () => contentMenu);*/
		</script>
	</body>
</html>
